<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copy-Paste Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Copy-Paste Helper</h1>
    <p class="lead">Use the buttons to copy or paste using the Clipboard API.</p>

    <textarea id="textArea" placeholder="Type something..."></textarea>

    <div class="controls">
      <button id="copyBtn">Copy Text</button>
      <button id="pasteBtn" class="secondary">Paste Text</button>
      <span id="status" class="status"></span>
    </div>

    
  </main>

  <script src="script.js"></script>
</body>
</html>
